<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Самолётик: Ас</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Russo+One&display=swap">
<style>
:root {
  --bg: #0f172a;
  --panel: #1e293b;
  --text: #e2e8f0;
  --accent: #38bdf8;
  --accent2: #f59e0b;
  --danger: #ef4444;
  --success: #10b981;
  --font-display: 'Russo One', sans-serif;
  --font-body: 'Manrope', sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
h1, h2, h3 { font-family: var(--font-display); letter-spacing: 0.05em; margin: 0; text-transform: uppercase; }

/* Layout */
#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
}
#header {
  padding: 10px 16px;
  background: var(--panel);
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px solid rgba(255,255,255,0.1);
  z-index: 10;
}
.stats { display: flex; gap: 12px; font-weight: 700; }
.stat-item { display: flex; align-items: center; gap: 4px; }
.stat-item span { color: var(--accent); font-size: 16px; }
#stage {
  flex: 1;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
}
canvas {
  display: block;
  max-width: 100%;
  max-height: 100%;
  box-shadow: 0 0 40px rgba(0,0,0,0.5);
  border-radius: 8px;
}
#ui-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  padding: 20px;
}
.panel {
  background: rgba(30, 41, 59, 0.95);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 16px;
  width: 100%;
  max-width: 400px;
  pointer-events: auto;
  display: grid;
  gap: 12px;
}
.section-title { font-size: 12px; color: var(--accent); margin-bottom: 4px; }
.btn {
  background: var(--panel);
  border: 1px solid rgba(255,255,255,0.2);
  color: var(--text);
  padding: 10px 16px;
  border-radius: 8px;
  font-family: var(--font-display);
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  position: relative;
  overflow: hidden;
}
.btn:hover:not(:disabled) { background: rgba(56, 189, 248, 0.2); border-color: var(--accent); }
.btn:active:not(:disabled) { transform: scale(0.98); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: #0f172a; border-color: var(--accent); font-weight: 800; }
.btn.primary:hover { background: #7dd3fc; }
.btn.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn.sm { padding: 6px 10px; font-size: 12px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
.row:last-child { border-bottom: none; }
.row-label { display: flex; flex-direction: column; }
.row-label small { font-size: 10px; color: #94a3b8; }
.pips { display: flex; gap: 2px; margin-top: 4px; }
.pip { width: 10px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; }
.pip.on { background: var(--accent); }
.grid-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.card { background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 8px; cursor: pointer; text-align: center; font-size: 12px; }
.card.active { border-color: var(--accent); background: rgba(56, 189, 248, 0.1); }
.card.disabled { opacity: 0.5; cursor: not-allowed; }
.card-icon { font-size: 20px; margin-bottom: 4px; display: block; }
#game-over { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; place-items: center; flex-direction: column; gap: 16px; }
#game-over h2 { font-size: 32px; color: var(--accent2); }
#game-over p { font-size: 18px; margin: 0; }
#flight-controls { display: none; position: absolute; inset: 0; pointer-events: none; }
#flight-controls * { pointer-events: auto; }
#landBtn { position: absolute; bottom: 20px; right: 20px; z-index: 5; }
#score-board { position: absolute; top: 16px; left: 16px; z-index: 5; font-family: var(--font-display); font-size: 24px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
#score-board span { color: var(--accent2); }
</style>
</head>
<body>

<div id="app">
  <header id="header">
    <h2>Самолётик: Ас</h2>
    <div class="stats">
      <div class="stat-item"><span>💰</span> <b id="money">$0</b></div>
      <div class="stat-item"><span>☁️</span> <b id="flights">0</b></div>
      <div class="stat-item"><span>🏆</span> <b id="best">0 м</b></div>
    </div>
  </header>
  
  <div id="stage">
    <canvas id="canvas"></canvas>
    
    <div id="ui-layer">
      <!-- Hangar Panel -->
      <div id="hangar-panel" class="panel" style="display:none;">
        <div>
          <div class="section-title">Выбери самолёт</div>
          <div class="grid-cards" id="plane-select"></div>
        </div>
        <div>
          <div class="section-title">Прокачка</div>
          <div id="upgrade-list"></div>
        </div>
        <div style="display:flex; gap:8px; margin-top:8px;">
          <button class="btn primary" id="flyBtn" style="flex:1;">В Полёт</button>
          <button class="btn" id="jobBtn" title="Подработка">🔧</button>
          <button class="btn danger" id="resetBtn" title="Сброс">🗑️</button>
        </div>
      </div>

      <!-- Flight Panel -->
      <div id="flight-controls">
        <div id="score-board">
          <div style="font-size:14px; color:#fff; opacity:0.8;">ДИСТАНЦИЯ</div>
          <span id="score-dist">0 м</span>
        </div>
        <button class="btn sm" id="landBtn">Посадка</button>
      </div>
    </div>

    <div id="game-over">
      <h2>Полёт окончен</h2>
      <div style="text-align:center; color:#e2e8f0;">
        <p>Пролетел: <span id="res-dist">0</span> м</p>
        <p>Монет: <span id="res-coins">0</span></p>
        <p style="font-size:24px; color:#f59e0b; margin-top:8px;">Заработано: <span id="res-total">$0</span></p>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn primary" id="againBtn">Ещё полёт</button>
        <button class="btn" id="homeBtn">В ангар</button>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // --- CONSTANTS & CONFIG ---
  const W = 360, H = 640;
  const FONT_DISPLAY = '"Russo One", sans-serif';
  const COLORS = {
    ink: '#0f172a',
    white: '#ffffff',
    accent: '#38bdf8',
    accent2: '#f59e0b',
    danger: '#ef4444',
    success: '#10b981',
    metal: '#94a3b8',
    darkMetal: '#475569'
  };

  // --- GAME DATA ---
  const PLANES = [
    { id: 'p1', name: 'Модель 1', desc: 'Баланс', hp: 3, speed: 1, color: '#38bdf8' },
    { id: 'p2', name: 'Модель 2', desc: 'Скорость', hp: 2, speed: 1.3, color: '#f59e0b' },
    { id: 'p3', name: 'Модель 3', desc: 'Броня', hp: 5, speed: 0.8, color: '#ef4444' },
    { id: 'p4', name: 'Модель 4', desc: 'Урон', hp: 3, speed: 1, color: '#10b981' }
  ];

  const UPGRADES = [
    { id: 'engine', name: 'Двигатель', desc: 'Скорость', base: 20, max: 5, icon: '⚙️' },
    { id: 'armor', name: 'Броня', desc: 'Здоровье', base: 30, max: 5, icon: '🛡️' },
    { id: 'gun', name: 'Пушка', desc: 'Урон', base: 25, max: 5, icon: '🔫' },
    { id: 'magnet', name: 'Магнит', desc: 'Радиус', base: 15, max: 5, icon: '🧲' }
  ];

  const ENEMY_TYPES = {
    fighter: { hp: 2, speed: 80, dmg: 1, fireRate: 2.5, color: '#ef4444', size: 20, score: 10 },
    zeppelin: { hp: 5, speed: 30, dmg: 2, fireRate: 4.0, color: '#f59e0b', size: 35, score: 25 }
  };

  // --- STATE ---
  let S = {
    money: 50,
    flights: 0,
    best: 0,
    selectedPlane: 'p1',
    upgrades: { engine: 0, armor: 0, gun: 0, magnet: 0 },
    unlockedPlanes: ['p1']
  };

  let gameState = 'hangar';
  let flightData = null;
  let canvas, ctx;
  let lastTime = 0;
  let keys = { left: false, right: false, fire: false };
  let mouseX = W / 2;

  // --- INIT ---
  function init() {
    canvas = document.getElementById('canvas');
    ctx = canvas.getContext('2d');
    
    // Load save
    try {
      const raw = localStorage.getItem('samolyotik-ace-v1');
      if (raw) Object.assign(S, JSON.parse(raw));
    } catch(e) {}

    updateUI();
    resize();
    window.addEventListener('resize', resize);
    
    // Event Listeners
    canvas.addEventListener('mousemove', e => {
      if (gameState === 'flight') {
        const rect = canvas.getBoundingClientRect();
        mouseX = (e.clientX - rect.left) / rect.width * W;
      }
    });
    canvas.addEventListener('touchmove', e => {
      if (gameState === 'flight') {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        mouseX = (e.touches[0].clientX - rect.left) / rect.width * W;
      }
    }, {passive: false});

    window.addEventListener('keydown', e => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
      if (e.code === 'Space' || e.code === 'ArrowUp') keys.fire = true;
    });
    window.addEventListener('keyup', e => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
      if (e.code === 'Space' || e.code === 'ArrowUp') keys.fire = false;
    });

    document.getElementById('flyBtn').onclick = startFlight;
    document.getElementById('landBtn').onclick = () => { if (flightData) flightData.ending = true; };
    document.getElementById('jobBtn').onclick = () => { S.money += 5; save(); updateUI(); };
    document.getElementById('againBtn').onclick = startFlight;
    document.getElementById('homeBtn').onclick = backToHangar;
    document.getElementById('resetBtn').onclick = () => {
      if(confirm('Сбросить весь прогресс?')) {
        localStorage.removeItem('samolyotik-ace-v1');
        location.reload();
      }
    };

    requestAnimationFrame(loop);
  }

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const stage = document.getElementById('stage');
    const scale = Math.min(stage.clientWidth / W, stage.clientHeight / H);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = (W * scale) + 'px';
    canvas.style.height = (H * scale) + 'px';
    ctx.scale(dpr, dpr);
  }

  function save() {
    try { localStorage.setItem('samolyotik-ace-v1', JSON.stringify(S)); } catch(e) {}
  }

  // --- UI RENDERING ---
  function updateUI() {
    document.getElementById('money').textContent = '$' + S.money;
    document.getElementById('flights').textContent = S.flights;
    document.getElementById('best').textContent = S.best + ' м';

    if (gameState === 'hangar') {
      renderHangar();
    }
  }

  function renderHangar() {
    document.getElementById('hangar-panel').style.display = 'grid';
    document.getElementById('flight-controls').style.display = 'none';
    document.getElementById('game-over').style.display = 'none';

    // Planes
    const pGrid = document.getElementById('plane-select');
    pGrid.innerHTML = PLANES.map(p => {
      const unlocked = S.unlockedPlanes.includes(p.id);
      const active = S.selectedPlane === p.id;
      return `<div class="card ${active ? 'active' : ''} ${!unlocked ? 'disabled' : ''}" data-id="${p.id}">
        <span class="card-icon">✈️</span>
        <b>${p.name}</b><br><small>${p.desc}</small>
      </div>`;
    }).join('');
    
    pGrid.querySelectorAll('.card').forEach(el => {
      el.onclick = () => {
        const id = el.dataset.id;
        if (S.unlockedPlanes.includes(id)) {
          S.selectedPlane = id;
          save(); updateUI();
        }
      };
    });

    // Upgrades
    const uList = document.getElementById('upgrade-list');
    uList.innerHTML = UPGRADES.map(u => {
      const lvl = S.upgrades[u.id];
      const cost = Math.round(u.base * Math.pow(1.8, lvl));
      const maxed = lvl >= u.max;
      const canAfford = S.money >= cost;
      
      let pips = '';
      for(let i=0; i<u.max; i++) pips += `<div class="pip ${i<lvl?'on':''}"></div>`;

      return `<div class="row">
        <div class="row-label">
          <div style="display:flex; align-items:center; gap:6px;">
            <span>${u.icon}</span>
            <b>${u.name}</b>
            <span class="pips">${pips}</span>
          </div>
          <small>${u.desc}</small>
        </div>
        <button class="btn sm" ${maxed || !canAfford ? 'disabled' : ''} data-uid="${u.id}" data-cost="${cost}">
          ${maxed ? 'MAX' : '$'+cost}
        </button>
      </div>`;
    }).join('');

    uList.querySelectorAll('button').forEach(btn => {
      btn.onclick = () => {
        const uid = btn.dataset.uid;
        const cost = parseInt(btn.dataset.cost);
        const u = UPGRADES.find(x => x.id === uid);
        if (S.money >= cost && S.upgrades[uid] < u.max) {
          S.money -= cost;
          S.upgrades[uid]++;
          save(); updateUI();
        }
      };
    });
  }

  function startFlight() {
    gameState = 'flight';
    const p = PLANES.find(x => x.id === S.selectedPlane);
    const up = S.upgrades;
    
    flightData = {
      plane: p,
      dist: 0,
      speed: 3 * (1 + up.engine * 0.15) * p.speed,
      hp: p.hp + up.armor,
      maxHp: p.hp + up.armor,
      gunLvl: up.gun,
      magnet: up.magnet * 30,
      x: W/2, y: H - 100,
      vx: 0, vy: 0,
      tilt: 0,
      coins: 0,
      score: 0,
      enemies: [],
      bullets: [],
      enemyBullets: [],
      particles: [],
      lastFire: 0,
      lastEnemySpawn: 0,
      ending: false,
      endTimer: 0,
      gameOver: false
    };

    document.getElementById('hangar-panel').style.display = 'none';
    document.getElementById('flight-controls').style.display = 'block';
    document.getElementById('game-over').style.display = 'none';
    document.getElementById('score-dist').textContent = '0 м';
    
    // Ensure canvas has focus for keyboard
    canvas.focus();
  }

  function backToHangar() {
    gameState = 'hangar';
    flightData = null;
    updateUI();
  }

  function endFlight() {
    const fd = flightData;
    const earned = Math.floor(fd.score + fd.dist * 0.1);
    S.money += earned;
    S.flights++;
    if (fd.dist > S.best) S.best = Math.floor(fd.dist);
    save();
    
    document.getElementById('flight-controls').style.display = 'none';
    document.getElementById('game-over').style.display = 'flex';
    document.getElementById('res-dist').textContent = Math.floor(fd.dist);
    document.getElementById('res-coins').textContent = fd.coins;
    document.getElementById('res-total').textContent = '$' + earned;
    
    gameState = 'gameover';
  }

  // --- GAME LOGIC ---
  function update(dt) {
    if (gameState !== 'flight' || !flightData) return;
    const fd = flightData;

    if (fd.ending) {
      fd.endTimer += dt;
      fd.speed *= 0.95;
      if (fd.endTimer > 1.5) { endFlight(); return; }
    }

    // Movement
    let targetX = fd.x;
    if (keys.left) targetX -= 250 * dt;
    if (keys.right) targetX += 250 * dt;
    if (mouseX !== null) targetX = mouseX;
    
    // Smooth move
    const dx = targetX - fd.x;
    fd.vx = dx * 10;
    fd.x += fd.vx * dt;
    fd.x = Math.max(30, Math.min(W - 30, fd.x));
    fd.tilt = Math.max(-0.3, Math.min(0.3, dx * 0.01));

    // Distance
    fd.dist += fd.speed * dt * 10;

    // Fire
    fd.lastFire += dt;
    if (fd.lastFire > 0.15) {
      fd.lastFire = 0;
      fd.bullets.push({ x: fd.x, y: fd.y - 20, vy: -800, dmg: 1 + fd.gunLvl * 0.5 });
    }

    // Spawn Enemies
    fd.lastEnemySpawn += dt;
    if (fd.lastEnemySpawn > 1.5 && !fd.ending) {
      fd.lastEnemySpawn = 0;
      const isZep = Math.random() < 0.2;
      const type = isZep ? 'zeppelin' : 'fighter';
      const e = ENEMY_TYPES[type];
      fd.enemies.push({
        type: type,
        x: 50 + Math.random() * (W - 100),
        y: -50,
        hp: e.hp + Math.floor(fd.dist / 500),
        maxHp: e.hp + Math.floor(fd.dist / 500),
        size: e.size,
        speed: e.speed,
        fireRate: e.fireRate,
        lastFire: Math.random() * e.fireRate,
        color: e.color,
        score: e.score,
        angle: 0
      });
    }

    // Update Enemies
    for (let i = fd.enemies.length - 1; i >= 0; i--) {
      const e = fd.enemies[i];
      e.y += e.speed * dt;
      e.angle += dt;

      // Enemy fire
      if (e.type === 'fighter') {
        e.lastFire += dt;
        if (e.lastFire > e.fireRate && !fd.ending) {
          e.lastFire = 0;
          fd.enemyBullets.push({ x: e.x, y: e.y + 20, vy: 300, dmg: 1 });
        }
      }

      // Collision with player
      if (Math.hypot(e.x - fd.x, e.y - fd.y) < e.size + 20) {
        fd.hp -= 1;
        createExplosion(e.x, e.y, e.color);
        fd.enemies.splice(i, 1);
        if (fd.hp <= 0) { fd.hp = 0; fd.ending = true; }
        continue;
      }

      if (e.y > H + 50) fd.enemies.splice(i, 1);
    }

    // Update Bullets
    for (let i = fd.bullets.length - 1; i >= 0; i--) {
      const b = fd.bullets[i];
      b.y += b.vy * dt;
      let hit = false;
      for (let j = fd.enemies.length - 1; j >= 0; j--) {
        const e = fd.enemies[j];
        if (Math.hypot(b.x - e.x, b.y - e.y) < e.size) {
          e.hp -= b.dmg;
          createExplosion(b.x, b.y, COLORS.accent);
          hit = true;
          if (e.hp <= 0) {
            createExplosion(e.x, e.y, e.color, 15);
            fd.score += e.score;
            fd.enemies.splice(j, 1);
          }
          break;
        }
      }
      if (hit || b.y < -20) fd.bullets.splice(i, 1);
    }

    // Update Enemy Bullets
    for (let i = fd.enemyBullets.length - 1; i >= 0; i--) {
      const b = fd.enemyBullets[i];
      b.y += b.vy * dt;
      if (Math.hypot(b.x - fd.x, b.y - fd.y) < 20) {
        fd.hp -= 1;
        createExplosion(b.x, b.y, COLORS.danger);
        fd.enemyBullets.splice(i, 1);
        if (fd.hp <= 0) { fd.hp = 0; fd.ending = true; }
        continue;
      }
      if (b.y > H + 20) fd.enemyBullets.splice(i, 1);
    }

    // Update Particles
    for (let i = fd.particles.length - 1; i >= 0; i--) {
      const p = fd.particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) fd.particles.splice(i, 1);
    }

    // Update UI text
    document.getElementById('score-dist').textContent = Math.floor(fd.dist) + ' м';
  }

  function createExplosion(x, y, color, count = 8) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 50 + Math.random() * 150;
      flightData.particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 0.3 + Math.random() * 0.4,
        maxLife: 0.7,
        color: color,
        size: 2 + Math.random() * 4
      });
    }
  }

  // --- RENDERING ---
  function draw() {
    ctx.clearRect(0, 0, W, H);

    if (gameState === 'hangar') {
      drawHangar();
    } else if (gameState === 'flight' || gameState === 'gameover') {
      drawFlight();
    }
  }

  function drawHangar() {
    // Background grid
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    for (let i = 0; i < W; i += 40) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, H); ctx.stroke();
    }
    for (let i = 0; i < H; i += 40) {
      ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(W, i); ctx.stroke();
    }

    // Draw plane in center
    const p = PLANES.find(x => x.id === S.selectedPlane);
    ctx.save();
    ctx.translate(W/2, H/2);
    ctx.scale(1.5, 1.5);
    drawPlayerPlane(0, 0, 0, p.color);
    ctx.restore();

    // Text
    ctx.fillStyle = COLORS.text;
    ctx.font = '20px ' + FONT_DISPLAY;
    ctx.textAlign = 'center';
    ctx.fillText('АНГАР', W/2, 80);
  }

  function drawFlight() {
    const fd = flightData;
    
    // Sky
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0ea5e9');
    grad.addColorStop(1, '#e0f2fe');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Clouds
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    for (let i = 0; i < 5; i++) {
      const y = (performance.now() * 0.05 * fd.speed + i * 150) % (H + 200) - 100;
      const x = (i * 137 + Math.sin(y * 0.01) * 50) % W;
      ctx.beginPath();
      ctx.arc(x, y, 40, 0, Math.PI * 2);
      ctx.arc(x + 30, y - 10, 30, 0, Math.PI * 2);
      ctx.arc(x - 30, y - 10, 30, 0, Math.PI * 2);
      ctx.fill();
    }

    // Enemies
    fd.enemies.forEach(e => {
      if (e.type === 'fighter') drawFighter(e);
      else drawZeppelin(e);
    });

    // Bullets
    ctx.fillStyle = COLORS.accent2;
    fd.bullets.forEach(b => {
      ctx.fillRect(b.x - 2, b.y - 10, 4, 15);
    });
    ctx.fillStyle = COLORS.danger;
    fd.enemyBullets.forEach(b => {
      ctx.beginPath();
      ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
      ctx.fill();
    });

    // Particles
    fd.particles.forEach(p => {
      const alpha = Math.max(0, p.life / p.maxLife);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;

    // Player
    if (!fd.ending || fd.endTimer < 1) {
      drawPlayerPlane(fd.x, fd.y, fd.tilt, fd.plane.color, fd.gunLvl);
    }

    // HUD
    drawHUD(fd);
  }

  function drawPlayerPlane(x, y, tilt, color, gunLvl = 0) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(tilt);
    
    // Shadow
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 10;
    ctx.shadowOffsetY = 5;

    // Body
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, -25);
    ctx.quadraticCurveTo(15, -10, 15, 10);
    ctx.lineTo(10, 25);
    ctx.lineTo(-10, 25);
    ctx.lineTo(-15, 10);
    ctx.quadraticCurveTo(-15, -10, 0, -25);
    ctx.fill();

    // Cockpit
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath();
    ctx.ellipse(0, -5, 6, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    // Wings
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.beginPath();
    ctx.moveTo(-15, 0);
    ctx.lineTo(-35, 10);
    ctx.lineTo(-35, 20);
    ctx.lineTo(-15, 15);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(15, 0);
    ctx.lineTo(35, 10);
    ctx.lineTo(35, 20);
    ctx.lineTo(15, 15);
    ctx.fill();

    // Propeller
    const time = performance.now() / 1000;
    const propAngle = time * 30;
    ctx.save();
    ctx.translate(0, -25);
    ctx.rotate(propAngle);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(0, 0, 18, 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Gun
    if (gunLvl > 0) {
      ctx.fillStyle = COLORS.accent2;
      ctx.fillRect(-12, -5, 4, 15);
      ctx.fillRect(8, -5, 4, 15);
    }

    ctx.restore();
  }

  function drawFighter(e) {
    ctx.save();
    ctx.translate(e.x, e.y);
    
    // Body
    ctx.fillStyle = e.color;
    ctx.beginPath();
    ctx.moveTo(0, -15);
    ctx.lineTo(10, 5);
    ctx.lineTo(0, 10);
    ctx.lineTo(-10, 5);
    ctx.closePath();
    ctx.fill();

    // Wings
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.moveTo(-8, 0);
    ctx.lineTo(-25, 10);
    ctx.lineTo(-25, 15);
    ctx.lineTo(-8, 10);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(8, 0);
    ctx.lineTo(25, 10);
    ctx.lineTo(25, 15);
    ctx.lineTo(8, 10);
    ctx.fill();

    // Cockpit
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath();
    ctx.arc(0, -2, 4, 0, Math.PI * 2);
    ctx.fill();

    // HP bar
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(-15, 15, 30, 4);
    ctx.fillStyle = COLORS.danger;
    ctx.fillRect(-15, 15, 30 * (e.hp / e.maxHp), 4);

    ctx.restore();
  }

  function drawZeppelin(e) {
    ctx.save();
    ctx.translate(e.x, e.y);
    
    // Body
    ctx.fillStyle = e.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, e.size, e.size * 0.6, 0, 0, Math.PI * 2);
    ctx.fill();

    // Gondola
    ctx.fillStyle = COLORS.darkMetal;
    ctx.fillRect(-15, e.size * 0.5, 30, 15);

    // Fins
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.moveTo(-e.size * 0.8, 0);
    ctx.lineTo(-e.size, 20);
    ctx.lineTo(-e.size * 0.6, 0);
    ctx.fill();

    // HP bar
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(-e.size, -e.size * 0.6 - 10, e.size * 2, 4);
    ctx.fillStyle = COLORS.accent2;
    ctx.fillRect(-e.size, -e.size * 0.6 - 10, e.size * 2 * (e.hp / e.maxHp), 4);

    ctx.restore();
  }

  function drawHUD(fd) {
    // Health
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(10, H - 30, 100, 15);
    ctx.fillStyle = COLORS.danger;
    ctx.fillRect(10, H - 30, 100 * (fd.hp / fd.maxHp), 15);
    ctx.strokeStyle = COLORS.white;
    ctx.strokeRect(10, H - 30, 100, 15);
    ctx.fillStyle = COLORS.white;
    ctx.font = '10px ' + FONT_BODY;
    ctx.textAlign = 'left';
    ctx.fillText('HP', 15, H - 19);
  }

  // --- MAIN LOOP ---
  function loop(time) {
    const dt = Math.min(0.05, (time - lastTime) / 1000);
    lastTime = time;
    
    update(dt);
    draw();
    
    requestAnimationFrame(loop);
  }

  // Start
  window.onload = init;

})();
</script>
</body>
</html>
